name: CI - Build and Push Docker Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2 — Build Docker image using your real image name
      - name: Build Docker image
        run: |
          docker build -t devynweir/my-fast-api:latest .

      # Step 3 — Log in to Docker Hub
      - name: Docker Hub Login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      # Step 4 — Push image to Docker Hub
      - name: Push Docker image
        run: |
          docker push devynweir/my-fast-api:latest

      # Step 5 — Set up Python (ONLY for running tests, not required for Docker deploy)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 6 — Install dependencies if needed
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 7 — Run tests
      - name: Run tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" || echo "No tests found"

      # Step 8 — Finished
      - name: Done
        run: echo "Build + Push workflow completed!"
